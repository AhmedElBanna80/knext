name: Advisory allowlist retirement (nightly)

# A security-allowlist entry is accepted risk with an exit condition. Nothing
# told us when the exit condition was met: the advisory withdrawn upstream, or a
# patched version published. This nightly runs the read-only probe
# `scripts/verify-allowlist-retirement.mjs` over the precompile-closure,
# npm-audit and osv allowlists and goes RED on any retirable entry. It also goes
# red if the GitHub API is unreachable: a probe that passes when it cannot reach
# upstream is worse than none.
#
# Logic and offline tests: `scripts/lib/allowlist-retirement.mjs`,
# `tests/allowlist-retirement.test.ts`. The probe never edits an allowlist.

on:
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe-allowlists:
    name: Probe every allowlist entry for retirement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe advisories (FAIL on any RETIRE finding or API error)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-allowlist-retirement.mjs

  nightly-red-alert:
    name: Nightly red alert (never pinned)
    needs: [probe-allowlists]
    # always() so a failed/cancelled probe still runs this job; the needs-result
    # check fires on failure OR cancelled so a timed-out probe does not go silent.
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.probe-allowlists.result == 'failure' || needs.probe-allowlists.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the "Advisory allowlist retirement RED" issue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_RESULT: ${{ needs.probe-allowlists.result }}
        run: |
          set -euo pipefail
          title='Advisory allowlist retirement RED'
          body="The nightly allowlist retirement probe FAILED: at least one allowlisted advisory was withdrawn upstream or now has a patched version, or the advisory API could not be reached. The job log lists each RETIRE or ERROR line with its allowlist file.

          - Run: ${RUN_URL}
          - Probe job result: ${CHECK_RESULT}

          Triage: drop the entry and bump the dependency (withdrawn: just drop the entry). An ERROR line means the check could not run, which is a failure rather than a pass; re-run to confirm."
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
