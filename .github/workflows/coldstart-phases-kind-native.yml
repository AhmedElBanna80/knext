name: Cold-start phases on kind (native amd64, manual)

# The kind cold-start phase harness (scripts/bench-cold-start-phases, the kind variant in kind/)
# on an amd64 ubuntu-latest runner. The earlier local-kind study ran the amd64 app image under
# Rosetta on an Apple-Silicon Mac, so its runtime-boot phase includes emulation. Here the node
# is amd64 and the image is amd64, so runtime boot is measured without it.
#
# MANUAL by design: a measurement tool, not a gate or a monitor. There is no schedule or
# pull_request trigger. The push trigger lists five dedicated branches (guard-tested in
# tests/coldstart-phases-kind-native-workflow.test.ts), each selecting one arm set:
#   bench/run-coldstart-native         default set (node-1000m, node-nolimit, bun-1000m)
#   bench/run-coldstart-native-ladder  ladder set (node 1000m, 2000m, 4000m, nolimit)
#   bench/run-coldstart-native-bun     bun set (bun-1000m, bun-nolimit, node-1000m control)
#   bench/run-coldstart-native-smoke   smoke set (node-1000m, N=1 allowed)
#   bench/run-coldstart-native-buildtool  buildtool set (node and bun, each built with turbopack
#                                      and with vinext, all at 1000m)
#
# Why push triggers exist: GitHub only dispatches a workflow file that exists on the default
# branch, and this file lives only on the v2 line, so `gh workflow run` returns 404. The five
# branches above stand in for the dispatch. They are pushed only by a maintainer, once per
# measurement; no other branch triggers on push. The names are exact (no wildcard). A push carries
# no dispatch inputs, so the set's default N applies (12, or 1 for smoke) with ready_window_s=20,
# and the validation step below checks those defaults exactly as it checks dispatched values. On
# dispatch, the `set` input (default `default`) selects the set instead of the branch name.
# Runner time per run, from run-budget.sh's estimate (n x arms x (45 s + window) + 25 min setup, with
# window 20 s on push): default about 64 min (3 x 12 x 65 s + 25 min), ladder about 77 min (4 x 12 x
# 65 s + 25 min), bun about 64 min (3 x 12 x 65 s + 25 min), smoke about 26 min (1 x 1 x 65 s + 25 min),
# buildtool about 77 min (4 x 12 x 65 s + 25 min; the four image builds sit in the setup estimate).
# A larger N fits only while it stays within the 135 min budget; run-budget.sh refuses anything above
# it. The concurrency group queues a
# re-dispatch behind it so two measurements never share the runner pool.
#
# Arms (one Knative Service each, interleaved by drive.py, N true scale-from-zero wakes per arm):
#   node-1000m    node runtime, cpu limit 1000m (the platform default)
#   node-nolimit  node runtime, cpu limit 64 CPUs (above any runner, so the CFS quota never binds)
#   bun-1000m     bun runtime, cpu limit 1000m
#   node-2000m, node-4000m   node runtime at 2 and 4 CPUs;  bun-nolimit   bun runtime, 64 CPUs
# Sets: default (the three above), ladder (node 1000m, 2000m, 4000m, nolimit), bun (bun-1000m,
# bun-nolimit, node-1000m as control), smoke (node-1000m, N=1: a cheap check of workflow changes),
# buildtool (the four build-tool arms below).
#
# Build-tool axis (the buildtool set). Every arm above builds the spike zone with the default build
# tool (turbopack). These four vary the build tool and the runtime on one app source, a fresh
# `knext create` scaffold per builder. Build and runtime are the intended variables; the scaffold's
# package.json differs per builder (the vinext one pins a newer react range), so the resolved next,
# react and react-dom versions are recorded per arm and compared by check-versions.sh:
#   node-turbopack-1000m  turbopack + node  .next/standalone under node, V8 compile cache baked in the image
#   bun-turbopack-1000m   turbopack + bun   the standalone server compiled to a Bun executable with bytecode
#   node-vinext-1000m     vinext + node     nitro node preset under node, V8 compile cache baked in the image
#   bun-vinext-1000m      vinext + bun      `vite build` compiled with `bun build --compile --bytecode`
# A user selects vinext with `build: "vinext"` in knext.config.ts (config.ts, `build`), and the runtime
# with `runtime: "node" | "bun"`; the two are independent. Per arm, record-evidence.sh reads the pushed
# image and writes evidence-<arm>.json (build target, runtime, and the compile-cache byte count or the
# bytecode verdict), which the step summary quotes and the artifact carries.
# The cpu limit is the NextApp scaling.cpuLimit, resolved by scripts/bench-cold-start-phases/kind/arms.sh.
#
# Image pull is 0 by construction: every arm is deployed and reaches Ready (which pulls the app and
# queue-proxy images onto the single node) before the first measured wake, and the summary counts
# any wake that still shows a Pulling event. The Ready window (ready_window_s) widens the harness's
# post-response wait so the pod Ready condition is recorded for every row.

on:
  push:
    branches:
      - bench/run-coldstart-native
      - bench/run-coldstart-native-ladder
      - bench/run-coldstart-native-bun
      - bench/run-coldstart-native-smoke
      - bench/run-coldstart-native-buildtool
  workflow_dispatch:
    inputs:
      set:
        description: 'Arm set: default, ladder, bun, smoke or buildtool (smoke is the only set that may run N=1)'
        required: false
        type: string
        default: 'default'
      n:
        description: 'True scale-from-zero wakes per arm (integer, 12 to 30; smoke may use 1 to 30). Empty = the set default'
        required: false
        type: string
        default: ''
      arms:
        description: 'Comma-separated arms (only with set=default): node-1000m, node-2000m, node-4000m, node-nolimit, bun-1000m, bun-nolimit, node-turbopack-1000m, bun-turbopack-1000m, node-vinext-1000m, bun-vinext-1000m'
        required: false
        type: string
        default: ''
      ready_window_s:
        description: 'Seconds the harness keeps watching after the first byte (integer, 16 to 45)'
        required: false
        type: string
        default: '20'

permissions:
  contents: read

# One run at a time on the group, queued rather than cancelled: the job applies manifests to an
# ephemeral kind cluster (kubectl apply, kn-next deploy), and repo policy disallows cancelling a
# state-mutating workflow mid-apply. A second dispatch waits for the first to finish.
concurrency:
  group: coldstart-phases-kind-native
  cancel-in-progress: false

jobs:
  phases:
    name: Cold-start phases (native amd64 kind)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLUSTER: coldstart-native
      APP_NS: z2
      NEXT_VERSION: 16.4.5
      # The arm set comes from the dispatch input, or on push from the branch name. N and ARMS are
      # resolved by the validation step below and exported through GITHUB_ENV.
      SET: ${{ inputs.set || (github.ref_name == 'bench/run-coldstart-native-ladder' && 'ladder') || (github.ref_name == 'bench/run-coldstart-native-bun' && 'bun') || (github.ref_name == 'bench/run-coldstart-native-smoke' && 'smoke') || (github.ref_name == 'bench/run-coldstart-native-buildtool' && 'buildtool') || 'default' }}
      N_INPUT: ${{ inputs.n || '' }}
      ARMS_INPUT: ${{ inputs.arms || '' }}
      READY_WINDOW_S: ${{ inputs.ready_window_s || '20' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dispatch inputs (or the push defaults) reach the shell through env only (never templated into run:).
      - name: Validate inputs
        run: |
          set -euo pipefail
          # A named set, or an explicit arm list (only with set=default), never both.
          if [ -n "$ARMS_INPUT" ] && [ "$SET" != default ]; then
            echo "::error::arms may only be given with set=default"; exit 1
          fi
          # An explicit arm list is never a set name (that would pick the set's arms while the N
          # floor below follows SET alone).
          case "$ARMS_INPUT" in default | ladder | bun | smoke | buildtool) echo "::error::arms must be an arm list, not a set name (use the set input)"; exit 1 ;; esac
          spec="${ARMS_INPUT:-$SET}"
          kind=scripts/bench-cold-start-phases/kind
          # The N floor and default come from SET only, never from the arm spec.
          MIN_N="$("$kind/arms.sh" --min-n "$SET")"
          N="${N_INPUT:-$("$kind/arms.sh" --default-n "$SET")}"
          case "$N" in ''|*[!0-9]*) echo "::error::n must be an integer"; exit 1 ;; esac
          # n is capped at 30; the combined check below (run-budget.sh) is what actually bounds the
          # run: n x arms x (45 s per wake + ready window) + 25 min setup must fit the 150 min timeout
          # minus 15 min for the analyse, upload and teardown steps. The 45 s and 25 min are estimates.
          # Only the smoke set may use N below 12 (MIN_N is 1 for it, 12 otherwise).
          [ "$N" -ge "$MIN_N" ] || { echo "::error::n must be $MIN_N or more for set $SET (got $N)"; exit 1; }
          [ "$N" -le 30 ] || { echo "::error::n must be 30 or fewer (got $N)"; exit 1; }
          case "$READY_WINDOW_S" in ''|*[!0-9]*) echo "::error::ready_window_s must be an integer"; exit 1 ;; esac
          if [ "$READY_WINDOW_S" -lt 16 ] || [ "$READY_WINDOW_S" -gt 45 ]; then
            echo "::error::ready_window_s must be 16 to 45 (got $READY_WINDOW_S)"; exit 1
          fi
          "$kind/arms.sh" "$spec" | tee "${RUNNER_TEMP}/arms.txt"
          "$kind/run-budget.sh" "$N" "$(wc -l < "${RUNNER_TEMP}/arms.txt" | tr -d ' ')" "$READY_WINDOW_S"
          echo "N=$N" >> "$GITHUB_ENV"
          echo "ARMS=$(cut -d' ' -f1 "${RUNNER_TEMP}/arms.txt" | paste -sd, -)" >> "$GITHUB_ENV"
          test "$(uname -m)" = x86_64 || { echo "::error::runner is not amd64"; exit 1; }

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build the workspace packages + the kn-next CLI
        run: |
          set -euo pipefail
          bun run --filter "@getknext/lib" build
          bun run --filter "@getknext/db" build
          bun run --filter "@getknext/core" build
          test -f packages/kn-next/dist/cli/kn-next.js

      - name: Pack knext adapter tarballs (npm pack, the real publish tool)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/knext-tarballs"
          node scripts/pack-release-tarballs.mjs --dest "${DEST}" \
            --dirs packages/lib,packages/db,packages/kn-next
          ls -la "${DEST}"
          echo "TARBALLS_DIR=${DEST}" >> "$GITHUB_ENV"

      - name: Create kind cluster (registry certs.d config_path)
        run: |
          set -euo pipefail
          cat <<'YAML' | kind create cluster --name "$CLUSTER" --wait 120s --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry]
              config_path = "/etc/containerd/certs.d"
          YAML
          kubectl get node -o jsonpath='{.items[0].status.nodeInfo.architecture}{"\n"}' | tee "${RUNNER_TEMP}/node-arch.txt"
          test "$(cat "${RUNNER_TEMP}/node-arch.txt")" = amd64

      - name: Start in-cluster registry + wire the kind node to it
        run: |
          set -euo pipefail
          reg=kind-registry
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --name "$reg" \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker network connect kind "$reg"
          node="${CLUSTER}-control-plane"
          docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
          printf '[host."http://%s:5000"]\n' "$reg" \
            | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml

      - name: Install cert-manager
        run: |
          set -euo pipefail
          scripts/kind-manifests/apply-cert-manager.sh
          kubectl wait --for=condition=Available --timeout=300s \
            -n cert-manager deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector

      - name: Install Knative Serving + Kourier
        run: |
          set -euo pipefail
          scripts/kind-manifests/apply-knative-kourier.sh "knative-v1.16.0"
          kubectl patch configmap/config-network -n knative-serving --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl wait --for=condition=Available --timeout=300s \
            -n knative-serving deployment/controller deployment/webhook deployment/autoscaler deployment/net-kourier-controller
          # Faster scale-to-zero so a cold sample does not cost a minute of waiting. It changes only
          # how soon a pod is removed, not how a cold start proceeds. The grace period is kept longer
          # than the Ready window so the pod outlives the harness's post-response watch.
          grace=$((READY_WINDOW_S + 10))
          kubectl patch configmap/config-autoscaler -n knative-serving --type merge \
            --patch "{\"data\":{\"stable-window\":\"10s\",\"scale-to-zero-grace-period\":\"${grace}s\",\"scale-to-zero-pod-retention-period\":\"0s\"}}"

      - name: Build the operator from HEAD (native amd64) and load it into kind
        working-directory: packages/kn-next-operator
        run: |
          set -euo pipefail
          IMG=example.com/kn-next-operator:e2e
          for attempt in 1 2 3; do
            make docker-build IMG="$IMG" && break
            [ "$attempt" = 3 ] && { echo "::error::operator image build failed 3x"; exit 1; }
            echo "docker-build attempt $attempt failed; retrying"; sleep 10
          done
          kind load docker-image "$IMG" --name "$CLUSTER"
          make install
          make deploy IMG="$IMG"
          kubectl rollout status deployment/kn-next-operator-controller-manager \
            -n kn-next-operator-system --timeout=180s
          kubectl wait --for=condition=Ready --timeout=120s \
            -n kn-next-operator-system certificate/kn-next-operator-serving-cert
          kubectl wait --for=jsonpath='{.subsets[0].addresses[0]}' --timeout=120s \
            -n kn-next-operator-system endpoints/kn-next-operator-webhook-service
          "${GITHUB_WORKSPACE}/scripts/kind-manifests/wait-for-webhook-ready.sh"

      - name: Namespace
        run: kubectl create namespace "$APP_NS"

      # vinext+bun compiles with `bytecode: true` but embeds no marker and `knext build` runs no
      # bytecode check on that executable, so its proof is a differential: the count of
      # `// @bun @bytecode @bun-cjs` module pragmas in the shipped binary must exceed the count in a
      # probe compiled WITHOUT bytecode for the same target and Bun (the runtime carries one copy of
      # the text itself). Built only when an arm needs it.
      - name: Build the no-bytecode baseline probe (vinext+bun pragma differential)
        run: |
          set -euo pipefail
          if awk '$2 == "bun" && $4 == "vinext" { f = 1 } END { exit !f }' "${RUNNER_TEMP}/arms.txt"; then
            echo 'console.log("knext bytecode baseline probe")' > "${RUNNER_TEMP}/probe.js"
            bun build --compile --minify --target=bun-linux-x64-musl "${RUNNER_TEMP}/probe.js" --outfile "${RUNNER_TEMP}/bytecode-baseline"
            test -s "${RUNNER_TEMP}/bytecode-baseline"
            echo "BYTECODE_BASELINE=${RUNNER_TEMP}/bytecode-baseline" >> "$GITHUB_ENV"
          fi

      # One Knative Service per arm, each through the real `kn-next deploy`. The zone is the minimal
      # Next.js app from the cold-start spike, staged OUTSIDE the repo (a real app is its own project
      # dir). The first arm of each (app, runtime, build tool) builds and pushes the amd64 image
      # natively; a later arm with the same key reuses that digest with --image, so a cpu-limit arm
      # differs from its sibling in the limit alone. The scaffold arms (the buildtool set) build a
      # fresh `knext create --builder <build> --runtime <runtime>` app instead of the spike zone.
      # Each arm is deployed to Ready, which pulls the app and queue-proxy images onto the node
      # before any measured wake.
      - name: Deploy every arm (kn-next deploy) and warm the node image cache
        run: |
          set -euo pipefail
          CLI="${GITHUB_WORKSPACE}/packages/kn-next/dist/cli/kn-next.js"
          out="${RUNNER_TEMP}/out"
          mkdir -p "$out"
          : > "${RUNNER_TEMP}/arm-images.txt"
          # fd 3, not stdin: kubectl, node and bun inside the loop must not eat the arm list.
          # arms.sh prints three columns for the arms that predate the build-tool axis; they are
          # turbopack on the spike zone.
          while read -r -u 3 arm runtime cpulimit build app; do
            build="${build:-turbopack}"
            app="${app:-spike}"
            key="${app}-${runtime}-${build}"
            cat > "${RUNNER_TEMP}/knext.config.${arm}.ts" <<EOF
          const config = {
            name: "${arm}",
            runtime: "${runtime}",
            build: "${build}",
            registry: "localhost:5001",
            healthCheckPath: "/api/health",
            scaling: { minScale: 0, maxScale: 1, cpuRequest: "250m", cpuLimit: "${cpulimit}", memoryRequest: "256Mi", memoryLimit: "512Mi" },
          };
          export default config;
          EOF
            reuse="$(awk -v k="$key" '$1==k {print $2; exit}' "${RUNNER_TEMP}/arm-images.txt")"
            if [ -n "$reuse" ]; then
              dir="${RUNNER_TEMP}/cfg-${arm}"
              mkdir -p "$dir"
              cp "${RUNNER_TEMP}/knext.config.${arm}.ts" "$dir/knext.config.ts"
              (cd "$dir" && node "$CLI" deploy --image "$reuse" --namespace "$APP_NS" --tag "r${GITHUB_RUN_ID}-${arm}")
            else
              dir="${RUNNER_TEMP}/zone-${key}"
              if [ "$app" = scaffold ]; then
                # A new app from this commit's scaffolder, so every build-tool arm runs the same
                # source. The generated knext.config.ts is then replaced by the arm's.
                node "$CLI" create "$dir" --name "$arm" --builder "${build}" --runtime "$runtime" --yes
              else
                mkdir -p "$dir"
                cp -R spikes/zone-functions-coldstart/zone/. "$dir/"
              fi
              (
                cd "$dir"
                mkdir -p public
                cp "${RUNNER_TEMP}/knext.config.${arm}.ts" knext.config.ts
                if [ "$app" = scaffold ]; then
                  # The three packed tarballs in one reify, so @getknext/core resolves its lib and db
                  # dependencies from them rather than the registry.
                  npm install --no-audit --no-fund "$(ls "${TARBALLS_DIR}"/getknext-lib-*.tgz)" "$(ls "${TARBALLS_DIR}"/getknext-db-*.tgz)" "$(ls "${TARBALLS_DIR}"/getknext-core-*.tgz)"
                else
                  bun install
                  bun add "$(ls "${TARBALLS_DIR}"/getknext-lib-*.tgz)" "$(ls "${TARBALLS_DIR}"/getknext-db-*.tgz)" "$(ls "${TARBALLS_DIR}"/getknext-core-*.tgz)"
                fi
                test -d node_modules/@getknext/core
                node -e "const v=require('./node_modules/next/package.json').version; if (v !== process.env.NEXT_VERSION) { console.error('next is ' + v); process.exit(1) }"
                # The build log is kept per image: it carries the compile-cache bake line.
                node "$CLI" deploy --registry localhost:5001 --namespace "$APP_NS" --tag "r${GITHUB_RUN_ID}-${arm}" 2>&1 | tee "${out}/build-${key}.log"
              )
            fi
            kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=300s "nextapp/${arm}" \
              || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe "nextapp/${arm}"; exit 1)
            img="$(kubectl -n "$APP_NS" get nextapp "$arm" -o jsonpath='{.spec.image}')"
            test -n "$img"
            echo "$key $img" >> "${RUNNER_TEMP}/arm-images.txt"
            echo "arm ${arm}: runtime=${runtime} build=${build} app=${app} cpuLimit=${cpulimit} image=${img}"
            kubectl -n "$APP_NS" get ksvc "$arm" -o jsonpath='{.spec.template.spec.containers[0].resources}{"\n"}'
            # The arm must run the runtime its name says. Two checks, both through check-runtime.sh,
            # which judges only the basename of argv[0] (so `node /app/bundle.js` is node and
            # `bun /app/node_modules/x` is bun): the rendered container command (the operator execs
            # `bun run server.js` for bun and leaves node on the image default), and the live process,
            # read from the kind node while the warm-up pod is still up. Either failing fails the job,
            # so a bun arm that silently ran node cannot produce a table.
            chk=scripts/bench-cold-start-phases/kind/check-runtime.sh
            # A node arm and any vinext arm render no container command (the image CMD runs it).
            flag=""; [ "$runtime" = node ] && flag="--allow-empty"; [ "$build" = vinext ] && flag="--allow-empty"
            # The live process of a vinext+bun arm is the compiled single executable (/app/server).
            proc_rt="$runtime"; [ "$build" = vinext ] && [ "$runtime" = bun ] && proc_rt="bun-exec"
            kubectl -n "$APP_NS" get ksvc "$arm" -o json \
              | jq -j '.spec.template.spec.containers[0].command // [] | .[] | ., "\u0000"' > "${RUNNER_TEMP}/cmd-${arm}.bin"
            echo "arm ${arm}: container command=$(tr '\0' ' ' < "${RUNNER_TEMP}/cmd-${arm}.bin")"
            "$chk" "$runtime" $flag < "${RUNNER_TEMP}/cmd-${arm}.bin" \
              || { echo "::error::arm ${arm} is a ${runtime} arm but its container command does not run ${runtime}"; exit 1; }
            # The newest Running pod that is not terminating (no deletionTimestamp).
            pod=""
            for _ in $(seq 1 30); do
              pod="$(kubectl -n "$APP_NS" get pods -l "serving.knative.dev/service=${arm}" -o json \
                | jq -r '[.items[] | select(.status.phase == "Running" and .metadata.deletionTimestamp == null)] | sort_by(.metadata.creationTimestamp) | last | .metadata.name // empty')"
              [ -n "$pod" ] && break
              sleep 1
            done
            [ -n "$pod" ] || { echo "::error::no running pod for arm ${arm} to verify its runtime"; exit 1; }
            # The runtime image is distroless (no shell, no cat), so nothing is exec'd into the app
            # container: the container id comes from the pod status, the kind-node pid from crictl on the
            # kind node, and the command line from that node's /proc.
            cid="$(kubectl -n "$APP_NS" get pod "$pod" -o jsonpath='{.status.containerStatuses[?(@.name=="user-container")].containerID}')"
            cid="${cid#containerd://}"
            [ -n "$cid" ] || { echo "::error::no user-container id for ${pod} (arm ${arm})"; exit 1; }
            knode="${CLUSTER}-control-plane"
            if ! inspect="$(docker exec "$knode" crictl inspect "$cid" 2>&1)"; then
              echo "::error::crictl inspect failed on ${knode} for container ${cid} (arm ${arm}; the pod may have scaled down): ${inspect}"; exit 1
            fi
            kpid="$(printf '%s' "$inspect" | jq -r '.info.pid')" \
              || { echo "::error::crictl inspect output for ${cid} (arm ${arm}) is not JSON"; exit 1; }
            case "$kpid" in ''|null|*[!0-9]*) echo "::error::crictl gave no pid for ${cid} (arm ${arm}): '${kpid}'"; exit 1 ;; esac
            docker exec "$knode" cat "/proc/${kpid}/cmdline" > "${RUNNER_TEMP}/proc-${arm}.bin" \
              || { echo "::error::could not read /proc/${kpid}/cmdline on ${knode} (arm ${arm})"; exit 1; }
            echo "arm ${arm}: main process = $(tr '\0' ' ' < "${RUNNER_TEMP}/proc-${arm}.bin")"
            "$chk" "$proc_rt" < "${RUNNER_TEMP}/proc-${arm}.bin" \
              || { echo "::error::arm ${arm} (${runtime}, ${build}) main process is not ${proc_rt}"; exit 1; }
            # The arm must also be the build tool its name says: spec.build on the CR (absent means
            # turbopack), and spec.runtime for the standalone shape (the CLI omits it for vinext,
            # where the runtime is fixed by the image).
            spec_build="$(kubectl -n "$APP_NS" get nextapp "$arm" -o jsonpath='{.spec.build}')"
            spec_runtime="$(kubectl -n "$APP_NS" get nextapp "$arm" -o jsonpath='{.spec.runtime}')"
            [ "${spec_build:-turbopack}" = "$build" ] \
              || { echo "::error::arm ${arm} is a ${build} arm but NextApp spec.build is '${spec_build}'"; exit 1; }
            if [ "$build" != vinext ] && [ "$spec_runtime" != "$runtime" ]; then
              echo "::error::arm ${arm} is a ${runtime} arm but NextApp spec.runtime is '${spec_runtime}'"; exit 1
            fi
            # Proof that bytecode (bun) or the compile cache (node) is in the image and in the live
            # process, read from the pushed image and the kind node. It fails the job when absent, so
            # no row is measured without it.
            scripts/bench-cold-start-phases/kind/record-evidence.sh "$arm" "$runtime" "$build" "$app" "$img" "${out}/build-${key}.log" "$out" "$knode" "$kpid"
            ev="${out}/evidence-${arm}.json"
            # The versions the arm's app actually resolved (shared by every arm with this key).
            versions="$(cd "${RUNNER_TEMP}/zone-${key}" && node -e "const o={}; for (const n of ['next','react','react-dom']) o[n]=require('./node_modules/'+n+'/package.json').version; console.log(JSON.stringify(o))")"
            jq --arg sb "${spec_build:-turbopack}" --arg sr "$spec_runtime" --arg cpu "$cpulimit" --argjson v "$versions" \
              '. + {spec_build: $sb, spec_runtime: $sr, cpu_limit: $cpu, versions: $v}' "$ev" > "${ev}.tmp"
            mv "${ev}.tmp" "$ev"
          done 3< "${RUNNER_TEMP}/arms.txt"
          # next must match on every scaffold arm and react within a build tool; react may differ
          # between build tools (recorded, with a NOTE).
          scripts/bench-cold-start-phases/kind/check-versions.sh "$out"

      # The harness pods run node:24-alpine. Load it into the node so no measured wake pays a pull
      # for it, then apply the kind harness manifest (harness, clock and agent pods plus the
      # additive NetworkPolicy that lets them probe the app past the operator's default policy).
      - name: Load the harness image and apply the kind harness manifest
        run: |
          set -euo pipefail
          # `kind load docker-image` imports --all-platforms, which fails with "content digest ...
          # not found" for a multi-platform index pulled for one platform. Pull the linux/amd64
          # single-platform manifest by digest, retag it, and load an archive. The index digest is
          # sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85 and 4eefa1bf... below is
          # its linux/amd64 manifest digest, derived with:
          #   docker buildx imagetools inspect node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
          docker pull --platform linux/amd64 node@sha256:4eefa1bfce4197942661ef9148247d779ddf1bb0ee006d3294a467609de60724
          docker tag node@sha256:4eefa1bfce4197942661ef9148247d779ddf1bb0ee006d3294a467609de60724 node:24-alpine
          docker save -o "${RUNNER_TEMP}/node-24-alpine.tar" node:24-alpine
          kind load image-archive "${RUNNER_TEMP}/node-24-alpine.tar" --name "$CLUSTER"
          kubectl apply -f scripts/bench-cold-start-phases/kind/phase-harness-kind.yaml
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=180s pod/phase-bench pod/clock-kind pod/agent-kind

      - name: Run the interleaved cold-start wakes
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out"
          export READY_WINDOW_MS=$((READY_WINDOW_S * 1000))
          python3 scripts/bench-cold-start-phases/drive.py "$N" "$ARMS" "${RUNNER_TEMP}/out/phases.jsonl" \
            --context "kind-${CLUSTER}" --namespace "$APP_NS" --settle 5
          wc -l "${RUNNER_TEMP}/out/phases.jsonl"

      - name: Collect control-plane logs and analyse each arm
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/out"
          kubectl -n knative-serving logs deploy/activator --tail=-1 > "$out/activator.jsonl" || true
          kubectl -n knative-serving logs deploy/autoscaler --tail=-1 > "$out/autoscaler.jsonl" || true
          analyse() {
            python3 scripts/bench-cold-start-phases/analyze.py "$1" --namespace="$APP_NS" --no-marker --p95 \
              --activator="$out/activator.jsonl" --autoscaler="$out/autoscaler.jsonl"
          }
          analyse "$out/phases.jsonl" > "$out/analysis-all.txt"
          while read -r -u 3 arm _; do
            python3 - "$out/phases.jsonl" "$arm" "$out/phases-${arm}.jsonl" <<'PY'
          import json, sys
          src, arm, dst = sys.argv[1:4]
          with open(dst, "w") as f:
              for line in open(src):
                  if line.strip() and json.loads(line).get("arm") == arm:
                      f.write(line)
          PY
            analyse "$out/phases-${arm}.jsonl" > "$out/analysis-${arm}.txt"
          done 3< "${RUNNER_TEMP}/arms.txt"

      - name: Step summary
        if: always()
        run: |
          out="${RUNNER_TEMP}/out"
          {
            echo "## Cold-start phases, native amd64 kind"
            echo
            echo "Runner arch: $(uname -m); kind node arch: $(cat "${RUNNER_TEMP}/node-arch.txt" 2>/dev/null || echo unknown); n=${N}; ready window=${READY_WINDOW_S}s."
            echo "Image pull: 0 by construction (every arm deployed to Ready before the first wake); the 'image pulled' column counts wakes that still show a Pulling event."
            echo
            if [ -s "$out/phases.jsonl" ]; then
              cut -d' ' -f1 "${RUNNER_TEMP}/arms.txt" | paste -sd, - | xargs python3 scripts/bench-cold-start-phases/kind/summarize-native.py "$out/phases.jsonl" || echo "(an arm has no rows)"
            else
              echo "No rows were written."
            fi
            echo
            echo "### Build target and bytecode evidence (read from each arm's pushed image)"
            echo
            echo "| arm | build target | runtime | app | proof |"
            echo "|---|---|---|---|---|"
            for f in "$out"/evidence-*.json; do
              [ -e "$f" ] || continue
              jq -r '"| \(.arm) | \(.build_target) | \(.runtime) | \(.app) | " + (if .bytecode.kind == "v8-compile-cache" then "V8 compile cache, \(.bytecode.bytes) bytes in \(.bytecode.files) file(s) at \(.bytecode.cache_dir); bake: \(.bytecode.bake_line)" else "Bun, \(.bytecode.method): \(.bytecode.verdict)" end) + "; next \(.versions.next), react \(.versions.react), react-dom \(.versions["react-dom"]) |"' "$f"
            done
            for f in "$out"/analysis-*.txt; do
              [ -e "$f" ] || continue
              echo
              echo "### $(basename "$f" .txt)"
              echo
              cat "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the jsonl and the analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coldstart-phases-kind-native
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: warn

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$APP_NS" get nextapp,ksvc,revision,pods -o wide 2>&1 || true
          kubectl -n "$APP_NS" get events --sort-by=.lastTimestamp 2>&1 | tail -40 || true
          kubectl -n kn-next-operator-system logs deploy/kn-next-operator-controller-manager --tail=100 2>&1 || true

      - name: Tear down
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER" || true
          docker rm -f kind-registry || true
