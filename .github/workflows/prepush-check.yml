name: Pre-push check

# Runs `scripts/prepush-check.mjs` on every pull request, so the check agents are told to run
# before pushing is not advisory.
#
# WHAT IT ENFORCES HERE
#   - A `Scope: <glob>, <glob>` line MUST be in the PR body. Missing is a FAILURE, not a warning.
#   - A scope that spans the repo is a FAILURE: it declares nothing. That is a wildcard over
#     directories (`**`, `**/*`, `*/**`), or globs that together touch 75% of the tracked top-level
#     directories or match over 60% of tracked files (`**/*.ts, **/*.md`).
#   - A brace glob (`{a,b}`) is a FAILURE: scope lines split on commas and would misread it.
#   - Every changed file must be inside the declared scope.
#   - Every changed file under `security/` (any depth, any extension but .md) must map to a gate:
#     a registered script, a test that reads it by path and that a workflow runs, or a documented
#     exemption. An input nothing gates is a FAILURE.
#   - Every `mkdtemp` under tests/ reaches a removal.
#
# WHY THE PR BODY, NOT A COMMIT TRAILER. A commit message can be amended or rebased after
# review to widen the scope. The PR body is the declaration reviewers read; CI reads it from the
# event payload, which is the PR body as of THIS run. `edited` re-runs the job when the body
# changes, so adding the line to an open PR does not need a push.
#
# WHAT IT DOES NOT DO (stated, not hidden; see CONTRIBUTING.md, "Before you push, part two")
#   - It does not EXECUTE the gates or the changed tests (--skip-gates --skip-tests). Each gate
#     already runs in its own workflow on the PR; this job proves a scope was declared and that
#     each changed security/ input has a gate to run.
#   - The scope is self-declared. It catches an accident (a PR that touches files outside its task),
#     not an author who declares an honest-looking but too-wide scope, and a revert INSIDE the
#     declared scope passes.
#
# Untrusted text: the PR body arrives through env and is read as DATA, never interpolated into
# the script (anyone who can edit the PR controls it).

on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepush-check:
    name: Pre-push check (scope + gate mapping)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history; the check diffs against the merge base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The check parses JavaScript and YAML with `typescript` and `yaml`, both pinned by bun.lock.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run prepush-check against the PR base
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # The checkout is the PR merge ref; fetch the base branch so the merge base resolves.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node scripts/prepush-check.mjs \
            --base "origin/${BASE_REF}" \
            --require-scope --skip-gates --skip-tests
