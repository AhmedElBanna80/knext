name: prepush-lib-drift

# `integration/v2` and `main` each carry a copy of the pre-push check. They must stay the same
# code and differ only in which gates and security/ files they register (the data-only block
# between `// BEGIN branch-specific` and `// END branch-specific` in
# scripts/lib/prepush-check.mjs). This runs scripts/prepush-lib-drift.mjs against the OTHER
# branch's tip and fails on divergence.
#
# SYMMETRIC: this file exists on both branches and compares against the other one, so a change
# introduced from EITHER side reds on that side's own pull request (the PR job compares the
# merged result against the other branch). A push re-checks after the merge; workflow_dispatch
# runs it on demand.
#
# LIMIT: the `paths:` filter means a pull request or push that touches none of the listed files does
# not run this. A change landing on the other branch is therefore not re-checked here until this
# side next touches one of those files; the nightly `schedule` (main's copy) and `workflow_dispatch`
# are what catch it sooner.
#
# Informational, not a required check. RED means one copy changed without the other: port the
# change. Until BOTH copies have landed it also fails ("not present on ...").
#
# CREDENTIALS: checkout does not persist the token (persist-credentials: false), so the fetch
# of the other branch passes it explicitly, through env (never inlined into the script), with
# the read-only contents scope below. Private repositories work.

on:
  pull_request:
    branches: [main, integration/v2]
    paths:
      - 'scripts/lib/prepush-check.mjs'
      - 'scripts/prepush-check.mjs'
      - 'scripts/prepush-lib-drift.mjs'
      - 'scripts/mutation-prove-prepush-check.mjs'
      - 'tests/prepush-check.test.ts'
      - '.github/workflows/prepush-check.yml'
      - '.github/workflows/prepush-lib-drift.yml'
  push:
    branches: [main, integration/v2]
    paths:
      - 'scripts/lib/prepush-check.mjs'
      - 'scripts/prepush-check.mjs'
      - 'scripts/prepush-lib-drift.mjs'
      - 'scripts/mutation-prove-prepush-check.mjs'
      - 'tests/prepush-check.test.ts'
      - '.github/workflows/prepush-check.yml'
      - '.github/workflows/prepush-lib-drift.yml'
  # A cron fires only from the DEFAULT branch, so main's copy is the one that runs. It checks main
  # against integration/v2 every night, which covers a change that landed on one side while the
  # `paths:` filter above kept this workflow from running on the other.
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prepush-lib-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The check parses JavaScript and YAML with `typescript` and `yaml`, both pinned by bun.lock.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Diff the two copies against the other branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          here="${BASE_REF:-$REF_NAME}"
          case "$here" in
            main) other=integration/v2 ;;
            integration/v2) other=main ;;
            *) echo "not run on main or integration/v2 (got '$here'); nothing to compare"; exit 0 ;;
          esac
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin \
            "+refs/heads/${other}:refs/remotes/origin/${other}"
          node scripts/prepush-lib-drift.mjs --other "origin/${other}" | tee -a "$GITHUB_STEP_SUMMARY"
