name: Rust function template

# The Rust zone-function template (templates/rust): a connect-rust server
# whose token check fails closed, built into a distroless image.
#
#   check        buf lint; `buf generate` with the pinned plugins must
#                reproduce the committed gen/ (proto is the source of truth);
#                cargo fmt; clippy -D warnings; cargo test (the token check,
#                the Connect/gRPC/gRPC-Web protocol matrix over h2c and
#                HTTP/1.1, the fail-closed wire scan, the request-read
#                bounds, the drain); cargo deny and cargo audit at pinned,
#                sha256-verified releases.
#   conformance  connect-rust is pre-1.0, so its pin is gated by the Connect
#                conformance suite (templates/rust/conformance.sh): the
#                upstream conformance server, built from the exact commit of
#                the connectrpc version in templates/rust/Cargo.lock with the
#                template's protocol stack, against the pinned,
#                sha256-verified connectconformance runner, every server test
#                on every protocol. Then the same suite against the template's
#                OWN stack (accept loop, timeouts, body bound, layers; only the
#                token check left out, dev profile only), with every crate the
#                release binary links held to templates/rust/Cargo.lock and any
#                deliberate refusals listed in conformance/known-failing.txt.
#   image        contents: read only, every event: build locally -> SBOM (syft,
#                SPDX) -> Trivy gate (FAIL on HIGH/CRITICAL). The binary is
#                built with `cargo auditable`, so the scan sees its crates.
#                This is where knext scans the template; an image a user
#                builds from it is scanned by the user's own pipeline.
#                Nothing here pushes or signs.
#   image-publish  push to main / integration/v2 only, never a pull request:
#                crane-push the EXACT scanned image (archive digest checked), then
#                cosign keyless sign + SBOM attestation by digest over GitHub OIDC,
#                then cosign verify + verify-attestation. The only job with
#                packages: write and id-token: write.
#   kind-e2e     the image as a cluster-local Knative Service with an h2c port
#                and no JWKS: the health check is served, every other RPC is
#                refused, the public gateway has no route; warm and from zero.
#
# buf is the lockfile's binary, verified against its sha256 pin
# (packages/grpc/scripts/verified-buf.ts) — never one from PATH.
#
# Only image-publish holds a write or OIDC credential, and it runs no buf and
# no repo script.

on:
  pull_request:
    paths:
      - 'templates/rust/**'
      - '.github/workflows/rust-template.yml'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/testdata/z7-token-vectors.json'
      - 'packages/grpc/src/add-function.ts'
      - 'packages/grpc/src/scaffold-rust.ts'
      - 'packages/grpc/src/scaffold-template.ts'
      - 'packages/grpc/src/buf.ts'
      - 'packages/grpc/src/cli.ts'
      - 'packages/grpc/scripts/copy-templates.mjs'
      - 'packages/grpc/scripts/knext-grpc.ts'
      - 'packages/grpc/src/__tests__/add-function-rust.test.ts'
      - 'packages/grpc/turbo.json'
      - 'scripts/kind-manifests/**'
      - 'tests/rust-template-contract.test.ts'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'templates/rust/**'
      - '.github/workflows/rust-template.yml'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/testdata/z7-token-vectors.json'
      - 'packages/grpc/src/add-function.ts'
      - 'packages/grpc/src/scaffold-rust.ts'
      - 'packages/grpc/src/scaffold-template.ts'
      - 'packages/grpc/src/buf.ts'
      - 'packages/grpc/src/cli.ts'
      - 'packages/grpc/scripts/copy-templates.mjs'
      - 'packages/grpc/scripts/knext-grpc.ts'
      - 'packages/grpc/src/__tests__/add-function-rust.test.ts'
      - 'packages/grpc/turbo.json'
      - 'scripts/kind-manifests/**'
      - 'tests/rust-template-contract.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-template-${{ github.ref }}
  # Only a pull-request run is safe to cancel: a push run can be mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_DENY_VERSION: 0.20.2
  # sha256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz (the release's own .sha256)
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_AUDIT_VERSION: 0.22.2
  # sha256 of cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
  CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
  CONFORMANCE_VERSION: v1.0.5
  # sha256 of connectconformance-v1.0.5-Linux-x86_64.tar.gz (the release's checksums.txt)
  CONFORMANCE_SHA256: 7d4d1f36980debf900b12514c8d51107245e9195b3c581e61fa165fd95c94284

jobs:
  check:
    name: Rust template (buf, fmt, clippy, test, deny, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain (templates/rust/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc -V
          cargo -V

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies (for the verified buf binary)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Cache the pinned codegen plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: templates/rust/.codegen
          key: rust-template-codegen-${{ runner.os }}-${{ hashFiles('templates/rust/codegen.sh', 'templates/rust/rust-toolchain.toml') }}

      - name: buf lint
        run: bun ../../packages/grpc/scripts/verified-buf.ts lint

      - name: buf generate reproduces the committed gen/
        run: |
          set -euo pipefail
          BUF="bun ../../packages/grpc/scripts/verified-buf.ts" ./codegen.sh
          if [ -n "$(git status --porcelain -- gen)" ]; then
            git status --porcelain -- gen
            git diff -- gen
            echo "::error::templates/rust/gen is out of date with proto/; run ./codegen.sh in templates/rust and commit gen/"
            exit 1
          fi

      - name: zstd is not in the release dependency graph
        run: |
          set -euo pipefail
          tree="${RUNNER_TEMP}/tree.txt"
          cargo tree --locked -e normal --target all --prefix none --format '{p}' > "${tree}"
          if [ ! -s "${tree}" ]; then
            echo "::error::cargo tree produced no output; the zstd check would be vacuous"
            exit 1
          fi
          if grep -E '^zstd(-sys|-safe)? ' "${tree}"; then
            echo "::error::zstd is compiled into the release binary; the template accepts gzip only"
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings (including the e2e client)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: The conformance feature (no token check) refuses to build in release
        # src/rpc/conformance.rs drops the token check for the Connect suite;
        # its compile_error! must stop any release build that turns it on.
        run: |
          set -euo pipefail
          if cargo check --release --locked --features conformance 2>build.err; then
            echo "a release build with the conformance feature compiled" >&2
            exit 1
          fi
          grep -q 'must never build in release' build.err

      - name: A scaffolded function builds, lints and passes its own tests
        # `knext add function --lang rust` copies this template; the copy must
        # build and pass outside the template directory. It generates its code
        # with the pinned plugins the drift check above already installed.
        working-directory: .
        env:
          KNEXT_RUST_CODEGEN_DIR: ${{ github.workspace }}/templates/rust/.codegen
        run: |
          set -euo pipefail
          app="$(mktemp -d)"
          (cd "$app" && bun "$GITHUB_WORKSPACE/packages/grpc/scripts/knext-grpc.ts" add function orders --lang rust)
          cd "$app/functions/orders"
          cargo fmt --check
          cargo build --locked --all-targets
          cargo check --locked --all-features --all-targets
          cargo clippy --all-targets --features e2e --locked -- -D warnings
          cargo test --locked

      - name: Install cargo-deny and cargo-audit (pinned releases, sha256-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          install -m 0755 "${deny}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          audit="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSL -o cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${audit}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz
          install -m 0755 "${audit}/cargo-audit" "${HOME}/.cargo/bin/cargo-audit"

      - name: cargo deny check (advisories, licenses, bans, sources)
        run: cargo deny check

      - name: cargo audit
        run: cargo audit --deny warnings

  conformance:
    name: Connect conformance (the pinned connectrpc server, then the function's own stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Builds and runs third-party code (the upstream conformance server), so
    # it holds read access to this repository and nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out connect-rust at the pinned release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: connectrpc/connect-rust
          ref: 7fd4a8248df90a6f5403c7066df0e44d4164d67f # v0.9.1
          path: connect-rust
          persist-credentials: false

      - name: Install the conformance runner (pinned release, sha256-verified)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          tarball="connectconformance-${CONFORMANCE_VERSION}-Linux-x86_64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/connectrpc/conformance/releases/download/${CONFORMANCE_VERSION}/${tarball}"
          echo "${CONFORMANCE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" connectconformance
          install -m 0755 connectconformance "${HOME}/.cargo/bin/connectconformance"

      # conformance.sh refuses a checkout that is not the connectrpc version
      # Cargo.lock pins, builds the upstream conformance server with the
      # template's buffa/hyper/hyper-util/h2 versions, and runs every server
      # test; then runs the suite against the function's own stack, with
      # every crate the release binary links held to Cargo.lock.
      - name: Run every server conformance test (Connect, gRPC, gRPC-Web), upstream server then the function's own stack
        run: templates/rust/conformance.sh connect-rust "${HOME}/.cargo/bin/connectconformance"

  image:
    name: Rust template image (build, SBOM, Trivy; read-only, every event)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # sha256 of the scanned image archive; the publish job refuses any other.
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    # This job runs on pull requests, so it holds no write credential: the
    # local composite action, the build, syft and Trivy all run with
    # contents: read only. Nothing here pushes or signs; the publish job below does.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      # Image repository names must be lowercase; the owner can be mixed-case.
      - name: Compute lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/knext-function-rust" >> "$GITHUB_ENV"

      - name: Build the template image (local only)
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" templates/rust

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: The SBOM lists the binary's crates (cargo auditable)
        run: |
          set -euo pipefail
          jq -e '[.packages[] | select(.name == "connectrpc")] | length > 0' sbom.spdx.json >/dev/null \
            || { echo "::error::the SBOM does not list connectrpc: the binary carries no dependency list"; exit 1; }

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-template-sbom-${{ github.sha }}
          path: sbom.spdx.json

      - name: Trivy scan — FAIL on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      # Hand the EXACT scanned image to the publish job (push to main /
      # integration/v2 only); nothing is rebuilt after the Trivy gate.
      - name: Archive the scanned image
        id: archive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/v2'
        run: |
          set -euo pipefail
          docker save "${IMAGE}:${GITHUB_SHA}" -o rust-template-image.tar
          echo "sha256=$(sha256sum rust-template-image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the scanned image + SBOM for the publish job
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/v2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-template-scanned-image-${{ github.sha }}
          path: |
            rust-template-image.tar
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: Rust template image publish + cosign sign (main / integration/v2 only)
    needs: [image]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/v2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR repository names must be lowercase; the owner can be mixed-case.
      - name: Compute lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/knext-function-rust" >> "$GITHUB_ENV"

      - name: Download the scanned image + SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-template-scanned-image-${{ github.sha }}

      - name: Verify the downloaded archive is the one that was scanned
        env:
          EXPECTED: ${{ needs.image.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum rust-template-image.tar | cut -d' ' -f1)"
          if ! printf '%s' "${EXPECTED}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::the scan job recorded no archive digest (got: '${EXPECTED}') — refusing to continue"
            exit 1
          fi
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::rust-template-image.tar is sha256:${ACTUAL}, the scan job scanned sha256:${EXPECTED} — refusing to continue"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane (version + checksum pinned)
        env:
          CRANE_VERSION: v0.21.7
          # sha256 of go-containerregistry_Linux_x86_64.tar.gz from the v0.21.7
          # release's checksums.txt (github.com/google/go-containerregistry).
          CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Push image (after the Trivy gate)
        id: push
        run: |
          set -euo pipefail
          PUSHED_REF="$(crane push rust-template-image.tar "${IMAGE}:${GITHUB_SHA}")"
          DIGEST="${PUSHED_REF##*@}"
          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve the pushed digest for ${IMAGE}:${GITHUB_SHA} (crane output: ${PUSHED_REF}) — refusing to sign"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image + attest the SBOM (keyless, by digest)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Verify Rust template image signature (cosign verify)
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/.*
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null

      - name: Verify Rust template SBOM attestation (cosign verify-attestation)
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/.*
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null

  kind-e2e:
    name: Rust template on kind (cluster-local h2c, fails closed)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Install the pinned Rust toolchain (templates/rust/rust-toolchain.toml)
        working-directory: templates/rust
        run: rustup toolchain install

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Create the kind cluster
        run: kind create cluster --name rust-template-e2e --wait 120s

      - name: Install Knative Serving + Kourier (checksum + digest pinned)
        run: |
          set -euo pipefail
          scripts/kind-manifests/apply-knative-kourier.sh knative-v1.16.0
          kubectl patch configmap/config-network -n knative-serving --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl patch configmap/config-autoscaler -n knative-serving --type merge \
            --patch '{"data":{"scale-to-zero-grace-period":"10s","scale-to-zero-pod-retention-period":"0s","stable-window":"6s"}}'
          kubectl wait --for=condition=Available --timeout=300s -n knative-serving \
            deployment/controller deployment/webhook deployment/autoscaler deployment/activator deployment/net-kourier-controller
          kubectl wait --for=condition=Available --timeout=300s -n kourier-system deployment/3scale-kourier-gateway

      - name: Deploy the function cluster-local and call it
        env:
          KIND_CLUSTER: rust-template-e2e
          SKIP_KNATIVE: '1'
        run: templates/rust/e2e/kind-e2e.sh
