name: Z11 activator-path drill — kind + Calico e2e

# Zone functions are reached through Knative's activator when they are at zero, so
# their NetworkPolicy cannot tell the zone from any other caller. This lane runs
# packages/grpc/e2e/z11-activator-drill/run.sh with its DEFAULT phases on kind with
# Calico: a foreign pod's token-less and garbage-token calls are refused by the
# function (401) through the activator; a direct dial to the warm pod is dropped by
# the policy; with the policy switched OFF a token-less call is still refused by the
# function itself (the in-process token check, not the network); and a function built
# without its token interceptor answers the same call.
#
# Deliberately no error-masking flag and no PHASES override: a red step is signal and
# the policy-off leg runs by default. Path-filtered like the other kind lanes; not a
# required check.

on:
  pull_request:
    paths:
      - 'packages/kn-next-operator/**'
      - '!packages/kn-next-operator/**/*_test.go'
      - '!packages/kn-next-operator/test/**'
      - '!packages/kn-next-operator/**/*.md'
      - 'templates/go/**'
      - 'packages/grpc/src/*.ts'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/scripts/**'
      - 'packages/grpc/e2e/**'
      - 'packages/grpc/package.json'
      - 'scripts/kind-manifests/**'
      - '.github/actions/docker-hub-mirror/**'
      - '.github/workflows/z11-activator-drill-e2e.yml'
      - 'tests/z11-activator-drill.test.ts'
      - 'bun.lock'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'packages/kn-next-operator/**'
      - '!packages/kn-next-operator/**/*_test.go'
      - '!packages/kn-next-operator/test/**'
      - '!packages/kn-next-operator/**/*.md'
      - 'templates/go/**'
      - 'packages/grpc/src/*.ts'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/scripts/**'
      - 'packages/grpc/e2e/**'
      - 'packages/grpc/package.json'
      - 'scripts/kind-manifests/**'
      - '.github/actions/docker-hub-mirror/**'
      - '.github/workflows/z11-activator-drill-e2e.yml'
      - 'tests/z11-activator-drill.test.ts'
      - 'bun.lock'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: z11-activator-drill-e2e-${{ github.ref }}-${{ github.event_name }}
  # Publishes nothing, so a superseded run on the same ref is safe to cancel.
  cancel-in-progress: true

jobs:
  z11-activator-drill:
    name: Z11 token refusal on the activator path, with and without the NetworkPolicy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER: z11-activator-drill
      REGISTRY_NAME: kind-registry
      REGISTRY_PORT: '5001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Go (the operator builds its tools and image from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install workspace dependencies (the pinned buf, the Connect runtime)
        run: bun install --frozen-lockfile

      - name: Run the Z11 activator-path drill (all phases, including policyoff)
        run: packages/grpc/e2e/z11-activator-drill/run.sh

      # run.sh prints object status on failure and never reads a Secret.
      - name: Delete the kind cluster and its registry
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true
          docker rm -f "${REGISTRY_NAME}" || true
