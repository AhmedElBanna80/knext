name: Z11 activator-path drill — kind + Calico e2e

# Zone functions are reached through Knative's activator when they are at zero, so
# their NetworkPolicy cannot tell the zone from any other caller. This lane runs
# packages/grpc/e2e/z11-activator-drill/run.sh with its DEFAULT phases on kind with
# Calico: a foreign pod's token-less and garbage-token calls are refused by the
# function (401) through the activator; a direct dial to the warm pod is dropped by
# the policy; with the policy switched OFF a token-less call is still refused by the
# function itself (the in-process token check, not the network); and a function built
# without its token interceptor answers the same call. Two more phases cover the failure
# mode the identity design names: the zone's key rotated and retired while the function is
# at zero (the cold pod that wakes accepts only the new key), and a call the activator holds
# past the token's life (refused as unauthenticated, token validation intact afterwards). A
# third covers the two together: a warm pod that cached the old key set, the key rotated under
# it, and one call held past the token's life and released to that same pod. The holds use a
# ResourceQuota in the function's namespace, not a cordon of the cluster's nodes.
#
# Deliberately no error-masking flag and no PHASES override: a red step is signal and
# the policy-off leg runs by default. Path-filtered to what can change the drill's
# outcome (the drill, the zone-function token code, the operator's NetworkPolicy and
# identity reconcile code, this file); not a required check.

on:
  pull_request:
    paths:
      # The drill itself and the lane helpers it sources.
      - 'packages/grpc/e2e/z11-activator-drill/**'
      - 'packages/grpc/e2e/lib/kind-lane.sh'
      # The Z7 probe the rotcold, held and heldwarm phases sign and send their calls with.
      - 'packages/grpc/e2e/z7-identity-kind/probe.ts'
      - 'packages/grpc/e2e/z7-identity-kind/probe-lib.ts'
      - 'scripts/kind-manifests/**'
      # Zone-function token code: the Go function's verifier, its interceptor wiring
      # (the noauth leg removes that line), and the zone-side signer.
      - 'templates/go/internal/auth/**'
      - '!templates/go/internal/auth/*_test.go'
      - 'templates/go/internal/rpc/rpc.go'
      - 'templates/go/main.go'
      - 'packages/grpc/src/signer.ts'
      - 'packages/grpc/src/runtime.ts'
      - 'packages/grpc/src/glue.ts'
      # The operator's NetworkPolicy and zone-identity reconcile code.
      - 'packages/kn-next-operator/internal/controller/netpol_*.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_networkpolicy.go'
      - 'packages/kn-next-operator/internal/controller/backendservice_render.go'
      - 'packages/kn-next-operator/internal/controller/identity.go'
      - 'packages/kn-next-operator/internal/controller/zone_signing_key*.go'
      - '!packages/kn-next-operator/**/*_test.go'
      # This lane and its guard.
      - '.github/workflows/z11-activator-drill-e2e.yml'
      - 'tests/z11-activator-drill.test.ts'
  push:
    branches: [main, 'integration/**']
    paths:
      # The drill itself and the lane helpers it sources.
      - 'packages/grpc/e2e/z11-activator-drill/**'
      - 'packages/grpc/e2e/lib/kind-lane.sh'
      # The Z7 probe the rotcold, held and heldwarm phases sign and send their calls with.
      - 'packages/grpc/e2e/z7-identity-kind/probe.ts'
      - 'packages/grpc/e2e/z7-identity-kind/probe-lib.ts'
      - 'scripts/kind-manifests/**'
      # Zone-function token code: the Go function's verifier, its interceptor wiring
      # (the noauth leg removes that line), and the zone-side signer.
      - 'templates/go/internal/auth/**'
      - '!templates/go/internal/auth/*_test.go'
      - 'templates/go/internal/rpc/rpc.go'
      - 'templates/go/main.go'
      - 'packages/grpc/src/signer.ts'
      - 'packages/grpc/src/runtime.ts'
      - 'packages/grpc/src/glue.ts'
      # The operator's NetworkPolicy and zone-identity reconcile code.
      - 'packages/kn-next-operator/internal/controller/netpol_*.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_networkpolicy.go'
      - 'packages/kn-next-operator/internal/controller/backendservice_render.go'
      - 'packages/kn-next-operator/internal/controller/identity.go'
      - 'packages/kn-next-operator/internal/controller/zone_signing_key*.go'
      - '!packages/kn-next-operator/**/*_test.go'
      # This lane and its guard.
      - '.github/workflows/z11-activator-drill-e2e.yml'
      - 'tests/z11-activator-drill.test.ts'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: z11-activator-drill-e2e-${{ github.ref }}-${{ github.event_name }}
  # Publishes nothing, so a superseded run on the same ref is safe to cancel.
  cancel-in-progress: true

jobs:
  z11-activator-drill:
    name: Z11 token refusal on the activator path, with and without the NetworkPolicy
    runs-on: ubuntu-latest
    # Measured, not guessed: a full local run of every phase took 26 min on a warm image cache
    # (up 2.5, deploy 1.3, token 3.0, direct 0.2, policyoff 2.1, noauth 2.2, rotcold 8.7,
    # held 6.0; a shared runner with cold pulls is slower). The 60 min budget this replaced was
    # sized for the first six phases (11 min locally, about 5x); 90 min is 3.5x the new total.
    # Re-measured locally (2026-11-19, with the Rust function deployed and the Rust policyoff leg; the up
    # phase excluded): deploy 283 s, token 137, direct 12, policyoff 128, noauth 133, rotcold 515, held 363;
    # 1571 s (26 min) in all. Two single runs of policyoff measured 126 s (Go only) and 128 s (Go and Rust),
    # a difference within run-to-run noise. The shared drain (await_zero_all) saved no measurable time,
    # because the Rust function is already idle at that point.
    # CI wall times (the figure the timeout rests on; the local numbers above are lower because CI cold-pulls
    # images): the three most recent green runs on integration/v2 took 2251 s (run 44567654663), 2313 s
    # (44548776897) and 2169 s (a pull request, 44558522202) for the job, and 2216 s for the drill step itself
    # in the first (https://github.com/AhmedElBanna80/knext/actions/runs/44567654663). The slowest is 2313 s
    # (38.6 min), 1.47x the 1571 s local figure. Timeout = the slowest CI job plus a 50 percent margin, rounded
    # up to 5 minutes: 2313 x 1.5 = 3470 s = 57.8 min, so 60. The 90 it replaces was 2.3x the CI figure, which
    # would have let a hung phase hold a runner for 50 minutes past a healthy run. No phase was cut.
    timeout-minutes: 60
    env:
      KIND_CLUSTER: z11-activator-drill
      REGISTRY_NAME: kind-registry
      REGISTRY_PORT: '5001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Go (the operator builds its tools and image from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install workspace dependencies (the pinned buf, the Connect runtime)
        run: bun install --frozen-lockfile

      - name: Run the Z11 activator-path drill (all phases, including policyoff, rotcold, held and heldwarm)
        run: packages/grpc/e2e/z11-activator-drill/run.sh

      # run.sh prints object status on failure and never reads a Secret.
      - name: Delete the kind cluster and its registry
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true
          docker rm -f "${REGISTRY_NAME}" || true
