name: Z7 identity tokens — kind e2e

# The operator half of Z7 (a per-zone Ed25519 signing key, the JWKS built from
# it, rotation) is proved by unit and envtest tests that have no kubelet, no
# serving layer and no pods. This lane runs it on a real cluster, with the operator
# built from this checkout and a zone bound to a Go and a Rust function built
# from the templates:
#
#   - the operator creates the zone's key Secret and JWKS ConfigMap; a call from
#     the zone's generated glue, through the real signer, succeeds with a real
#     served token (Go: the generated query and Server Action; Rust: the same
#     signer);
#   - no token, a garbage token, a token from another key, a forged kid, a token
#     for another function or RPC, an expired one and one from another issuer
#     are each refused, next to a control that differs in that one property;
#   - a rotation by annotation publishes the new key, a WARM function accepts a
#     token signed by it before the switch, signing switches only after the
#     propagation bound, the zone picks up the new key, the previous key keeps
#     verifying during the overlap, and no call through the zone fails;
#   - retirement removes the previous key from the Secret and the JWKS and a
#     warm function then refuses it;
#   - the function pod holds no private key and takes the JWKS as a directory
#     volume (no subPath, no env); no key material reaches any log or event.
#
# Then, on the same cluster, packages/grpc/e2e/z10-zone-functions-kind/run.sh (#2055):
# the zone warm and its Go and Rust functions at minScale 0, so every call wakes a
# function through Knative's activator; the call lands, and a failed call's code
# (NotFound) reaches the zone's glue unchanged, next to a warm control.
#
# packages/grpc/e2e/z7-identity-kind/run.sh is the whole lane and runs the same
# on a developer's kind cluster. Not proved here, and stated in run.sh: the
# one-hour overlap is a constant (retirement backdates its stamp), NetworkPolicy
# enforcement (the Calico drill owns that), a built Next.js zone, and OKE.
#
# Deliberately NO continue-on-error: every assertion is state-based (Secret and
# JWKS contents, operator timestamps, pod identity, HTTP status), so a red step
# is signal. Path-filtered like the other kind lanes; not a required check.

on:
  pull_request:
    paths:
      # The whole operator: the lane builds its image and installs its CRDs and
      # RBAC, so any of it can change what a zone's key does. Its own tests and
      # docs cannot (envtest and unit tests have their own lanes).
      - 'packages/kn-next-operator/**'
      - '!packages/kn-next-operator/**/*_test.go'
      - '!packages/kn-next-operator/test/**'
      - '!packages/kn-next-operator/**/*.md'
      - 'templates/go/**'
      - 'templates/rust/**'
      - 'packages/grpc/src/*.ts'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/scripts/**'
      - 'packages/grpc/e2e/**'
      - 'packages/grpc/package.json'
      - 'scripts/kind-manifests/**'
      - '.github/actions/docker-hub-mirror/**'
      - '.github/workflows/z7-identity-kind-e2e.yml'
      - 'tests/z7-identity-kind-e2e-lane.test.ts'
      - 'tests/z10-zone-functions-kind-lane.test.ts'
      - 'bun.lock'
  push:
    branches: [main, 'integration/**']
    paths:
      # The whole operator: the lane builds its image and installs its CRDs and
      # RBAC, so any of it can change what a zone's key does. Its own tests and
      # docs cannot (envtest and unit tests have their own lanes).
      - 'packages/kn-next-operator/**'
      - '!packages/kn-next-operator/**/*_test.go'
      - '!packages/kn-next-operator/test/**'
      - '!packages/kn-next-operator/**/*.md'
      - 'templates/go/**'
      - 'templates/rust/**'
      - 'packages/grpc/src/*.ts'
      - 'packages/grpc/proto/**'
      - 'packages/grpc/scripts/**'
      - 'packages/grpc/e2e/**'
      - 'packages/grpc/package.json'
      - 'scripts/kind-manifests/**'
      - '.github/actions/docker-hub-mirror/**'
      - '.github/workflows/z7-identity-kind-e2e.yml'
      - 'tests/z7-identity-kind-e2e-lane.test.ts'
      - 'tests/z10-zone-functions-kind-lane.test.ts'
      - 'bun.lock'
  # The weekly real-time rotation (about 1.5 runner-hours) is the only run that sees
  # the operator retire the previous key on its own one-hour schedule. GitHub fires
  # `schedule:` only from the default branch's copy of a workflow, and this file
  # exists on integration/v2 only, so the cron lives in a thin caller on main
  # (z7-rotation-weekly.yml) that `uses:` this file with rotation_realtime: true.
  # There is deliberately no `schedule:` here: it could never fire.
  workflow_call:
    inputs:
      rotation_realtime:
        description: 'Run the real-time key rotation (waits the real one-hour overlap; over an hour)'
        type: boolean
        default: false
      # A called workflow runs with the CALLER's github context: github.ref, github.sha
      # and github.event_name are the caller's (main, schedule), and so is
      # github.workflow_ref, so none of them can tell this file "I was called, check
      # out integration/v2". An input can: it exists only on a call (on push, pull
      # request and dispatch `inputs.checkout_ref` is empty, and an empty `ref:` means
      # the triggering ref, which is what those events want).
      checkout_ref:
        description: 'Ref the lane checks out (the caller runs on main; this file lives on integration/v2)'
        type: string
        default: integration/v2
  workflow_dispatch:
    inputs:
      rotation_realtime:
        description: 'Also run the real-time key rotation (waits the real one-hour overlap; over an hour)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The event is part of the key so a push to the branch cannot cancel the weekly
  # real-time run that is mid-way through its one-hour overlap.
  group: z7-identity-kind-e2e-${{ github.ref }}-${{ github.event_name }}
  # Publishes nothing, so a superseded run on the same ref is safe to cancel.
  cancel-in-progress: true

jobs:
  z7-identity-e2e:
    name: Z7 zone identity tokens on kind (key, JWKS, rotation, warm functions)
    runs-on: ubuntu-latest
    # The real-time rotation (the rotation_realtime input, by dispatch or the weekly caller) waits a one-hour
    # constant, so a run that does it gets the longer bound; every other run gets 65 minutes: the 55 it had,
    # plus 10 for the two phases added after wake (imagepin, http11), each of which waits out a drain to
    # zero and a zone roll or a recovery. Measured, local kind (2026-11-19): the Z10 run alone, with the Rust function and every phase, took 1611 s (27 min; images 9, deploy 72, cold 66, connecterr 128, grpctrailers 249, zerozone 192, rollout 246, sovereignty 27, crosszone 24, wake 288, imagepin 63, http11 247). The Z7 phases before it are not part of that figure. A failing
    # wait fails its phase at its own bound, so 65 is not a license to hang, only room for a healthy run.
    timeout-minutes: ${{ inputs.rotation_realtime && 120 || 65 }}
    env:
      KIND_CLUSTER: z7-identity-e2e
      REGISTRY_NAME: kind-registry
      REGISTRY_PORT: '5001'
      # The Rust function is bound in CI: its verifier reads the same JWKS file
      # on its own schedule, so it is a separate proof of a warm reload.
      Z7_WITH_RUST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See workflow_call.inputs.checkout_ref: a call would otherwise check out main.
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Go (the operator builds its tools and image from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install workspace dependencies (the pinned buf, the Connect runtime)
        run: bun install --frozen-lockfile

      - name: Run the Z7 identity-token e2e on kind
        if: ${{ !inputs.rotation_realtime }}
        run: packages/grpc/e2e/z7-identity-kind/run.sh

      # Called weekly from main or dispatched with the input (false on a push or a
      # pull request): the rotation in REAL time. The operator's one-hour overlap is a constant, so
      # the only way to see the previous key retire on the operator's own schedule
      # is to wait it. Replaces the default phases for that run; over an hour.
      - name: Run the real-time key rotation on kind (weekly call or dispatch input rotation_realtime)
        if: ${{ inputs.rotation_realtime }}
        env:
          PHASES: up images deploy verify rotation
        run: packages/grpc/e2e/z7-identity-kind/run.sh

      # Z10 reuses the cluster, Knative and operator the Z7 run just built, so the
      # cold path costs only its own phases, not a second cluster.
      - name: Run the Z10 zone-functions cold-path e2e on the same cluster
        if: ${{ !inputs.rotation_realtime }}
        env:
          Z10_WITH_RUST: '1'
        run: packages/grpc/e2e/z10-zone-functions-kind/run.sh

      # run.sh prints object status and log tails on failure and never reads a
      # Secret, so nothing more is collected here.
      - name: Delete the kind cluster and its registry
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true
          docker rm -f "${REGISTRY_NAME}" || true
