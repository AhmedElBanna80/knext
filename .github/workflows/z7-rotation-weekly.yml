name: Z7 key rotation weekly (real time)

# The real-time zone signing-key rotation is the only run that sees the operator
# retire the previous key on its own one-hour schedule. GitHub fires `schedule:`
# ONLY from the default branch's copy of a workflow, and the Z7 kind lane
# (z7-identity-kind-e2e.yml) lives on integration/v2, so a `schedule:` inside it
# never fires.
#
# This file is a THIN CALLER and nothing else. It exists on main so the cron fires,
# and it `uses:` the lane on integration/v2 through its `workflow_call` trigger with
# `rotation_realtime: true`. The lane owns every step; there is one copy of the
# rotation job, on integration/v2, so there is nothing here to drift. The called
# workflow checks integration/v2 out itself (a called workflow inherits the caller's
# ref, main) and applies its own 120-minute bound.
#
# Depends on the lane having `workflow_call` on integration/v2; until that is merged
# the call cannot resolve and the run fails red (and alerts).
#
# A red run is signal: every assertion in run.sh is state-based. The alert job opens
# or updates one issue (never pinned) the same way mutation-prover-nightly.yml does.
# No secrets.

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z7-rotation-weekly-${{ github.ref }}
  # Never cancel a run that is mid-way through its one-hour overlap.
  cancel-in-progress: false

jobs:
  rotation:
    name: Z7 real-time key rotation on kind (integration/v2 lane)
    # The called workflow needs only contents: read.
    permissions:
      contents: read
    uses: AhmedElBanna80/knext/.github/workflows/z7-identity-kind-e2e.yml@integration/v2
    with:
      rotation_realtime: true

  # ── Idempotent alert (same pattern as mutation-prover-nightly) ─────────────
  rotation-red-alert:
    name: Weekly rotation red alert (issue)
    needs: [rotation]
    # always() so this is not skipped when the call fails; a cancelled or timed-out
    # run alerts too (a silent cancelled run is the failure mode #1645 fixed). The
    # event check scopes it to the schedule.
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.rotation.result == 'failure' || needs.rotation.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # Read-only: lists which jobs were not green, so the issue names the step.
      actions: read
    steps:
      # The alert step shells out to scripts/nightly-alert-issue.mjs, which requires
      # the repo to be checked out.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the "Z7 weekly key rotation RED" issue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          ROTATION_RESULT: ${{ needs.rotation.result }}
        run: |
          set -euo pipefail
          # Which jobs were not green. Best effort by design: failing to LIST
          # them must never suppress the alert itself.
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | "- " + .name + ": " + .conclusion' \
            2>/dev/null || true)"
          [ -n "${jobs}" ] || jobs="- (could not list the jobs; read the run)"
          # The idempotency KEY is this fixed literal title: the lookup and the
          # create MUST share it, so keep it a constant (never interpolated).
          title='Z7 weekly key rotation RED'
          body="The weekly real-time zone signing-key rotation (z7-identity-kind-e2e.yml on
          integration/v2, called from main with rotation_realtime: true) FAILED or was CANCELLED.
          It is the only run that sees the operator retire the previous key on its own one-hour
          schedule, so a red here means the rotation drill did not prove retirement.

          - Run: ${RUN_URL}
          - Rotation call: ${ROTATION_RESULT}

          Jobs that were not green:

          ${jobs}

          Triage: open the failing step in the called lane's log first. A call that never started
          (workflow not found, or the called file has no workflow_call) is a wiring failure, not a
          rotation failure. Re-run the workflow to confirm the fix, then close this issue."
          # Create-or-update via the shared, never-pinning helper (GitHub caps pinned
          # issues at 3, and a failed pin must never hide a red).
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
