name: Z7 key rotation weekly (real time)

# The real-time zone signing-key rotation is the only run that sees the operator
# retire the previous key on its own one-hour schedule. GitHub fires `schedule:`
# ONLY from the default branch's copy of a workflow, and the Z7 kind lane
# (z7-identity-kind-e2e.yml) lives on integration/v2, so a `schedule:` inside it
# never fires.
#
# This file is a THIN CALLER and nothing else. It exists on main so the cron fires,
# and it `uses:` the lane on integration/v2 through its `workflow_call` trigger with
# `rotation_realtime: true`. The lane owns every step; there is one copy of the
# rotation job, on integration/v2, so there is nothing here to drift. The called
# workflow checks integration/v2 out itself (a called workflow inherits the caller's
# ref, main) and applies its own 120-minute bound.
#
# Depends on the lane having `workflow_call` on integration/v2 (the lane PR must merge
# BEFORE this one). If the called file is missing, lacks `workflow_call`, or this file
# passes an input it does not declare, GitHub fails the whole run at startup and NO job
# runs. So neither `rotation-red-alert` nor `wiring-check` can fire for drift in the
# called file or its inputs; a startup failure is visible only as a red run in the
# Actions tab. The drift DETECTOR is the nightly action-pin resolver
# (`scripts/verify-action-pins.mjs`): it reads the called file at its branch ref and
# compares this file's `with:` keys against the declared `workflow_call` inputs.
# `wiring-check` below covers only the narrower case where the run still starts.
#
# `preflight` fails loudly when this file runs in a repository other than the one the
# `uses:` line names (the owner is hardcoded: update both after the move back).
#
# A red run is signal: every assertion in run.sh is state-based. The alert job opens
# or updates one issue (never pinned) the same way mutation-prover-nightly.yml does.
# No secrets.

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z7-rotation-weekly-${{ github.ref }}
  # Never cancel a run that is mid-way through its one-hour overlap.
  cancel-in-progress: false

jobs:
  # The `uses:` owner below is hardcoded to the temporary home. Keep EXPECTED_REPOSITORY
  # equal to it (tests/z7-rotation-weekly-schedule.test.ts ties them together).
  preflight:
    name: Caller repository matches the uses owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if this repository is not the one named in uses
        env:
          EXPECTED_REPOSITORY: AhmedElBanna80/knext
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${ACTUAL_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]; then
            echo "::error::z7-rotation-weekly.yml runs in ${ACTUAL_REPOSITORY} but its uses: line names ${EXPECTED_REPOSITORY}. After the move back to getknext-dev, update the uses: owner (and EXPECTED_REPOSITORY) in this file."
            exit 1
          fi

  # Independent of the call: checks the called file exists on integration/v2 with a
  # workflow_call trigger, and files the issue if not. Best effort for the case where
  # the whole run still starts; a startup failure is not reachable from inside a job.
  wiring-check:
    name: Called lane exists on integration/v2 with workflow_call
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the called workflow and alert if it is not callable
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          LANE_PATH: .github/workflows/z7-identity-kind-e2e.yml
          LANE_REF: integration/v2
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${LANE_PATH}?ref=${LANE_REF}" --jq .content 2>/dev/null \
              | base64 -d | grep -Eq '^[[:space:]]*workflow_call:'; then
            echo "Lane present with workflow_call."
            exit 0
          fi
          echo "::error::${LANE_PATH} is missing on ${LANE_REF} or has no workflow_call trigger"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TITLE='Z7 weekly key rotation WIRING BROKEN' \
            BODY="The weekly rotation caller on main cannot call ${LANE_PATH} on ${LANE_REF}: the file is missing or has no workflow_call trigger. The call fails at startup, so the rotation did not run. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            node scripts/nightly-alert-issue.mjs
          fi
          exit 1

  rotation:
    name: Z7 real-time key rotation on kind (integration/v2 lane)
    # The called workflow needs only contents: read.
    permissions:
      contents: read
    needs: [preflight]
    # TEMPORARY SHA pin of the WORKFLOW YAML only. A branch ref is only trusted once the
    # branch is protected (PROTECTED_REFS); neither main nor integration/v2 is protected on
    # this temporary repo yet, so whoever can push integration/v2 would run workflow steps
    # here. The pin freezes z7-identity-kind-e2e.yml (steps, env, timeout). It does NOT
    # freeze the scripts: checkout_ref below is the floating integration/v2 tip, so run.sh,
    # probe.ts and everything they call come from that tip. The two must stay
    # compatible (same flags, paths and env names); re-check when either side changes.
    # The trailing branch comment is resolved by the nightly (the SHA must be reachable
    # from that branch). When the founder protects both branches (see
    # z7-watchdog-nightly.yml's protected-ref check), re-point this to `@integration/v2`.
    # Until then, bump the SHA whenever v2's Z7 workflow YAML changes.
    uses: AhmedElBanna80/knext/.github/workflows/z7-identity-kind-e2e.yml@bdbe014b20f29cb7fd42de6a82fc4c162ec1f9dd # integration/v2
    with:
      rotation_realtime: true
      checkout_ref: integration/v2

  # ── Idempotent alert (same pattern as mutation-prover-nightly) ─────────────
  rotation-red-alert:
    name: Weekly rotation red alert (issue)
    needs: [preflight, rotation]
    # always() so this is not skipped when the call fails; a cancelled or timed-out
    # run alerts too (a silent cancelled run is the failure mode #1645 fixed). The
    # event check scopes it to the schedule.
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled' || needs.rotation.result == 'failure' || needs.rotation.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # Read-only: lists which jobs were not green, so the issue names the step.
      actions: read
    steps:
      # The alert step shells out to scripts/nightly-alert-issue.mjs, which requires
      # the repo to be checked out.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the "Z7 weekly key rotation RED" issue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          ROTATION_RESULT: ${{ needs.rotation.result }}
        run: |
          set -euo pipefail
          # Which jobs were not green. Best effort by design: failing to LIST
          # them must never suppress the alert itself.
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | "- " + .name + ": " + .conclusion' \
            2>/dev/null || true)"
          [ -n "${jobs}" ] || jobs="- (could not list the jobs; read the run)"
          # The idempotency KEY is this fixed literal title: the lookup and the
          # create MUST share it, so keep it a constant (never interpolated).
          title='Z7 weekly key rotation RED'
          body="The weekly real-time zone signing-key rotation (z7-identity-kind-e2e.yml on
          integration/v2, called from main with rotation_realtime: true) FAILED or was CANCELLED.
          It is the only run that sees the operator retire the previous key on its own one-hour
          schedule, so a red here means the rotation drill did not prove retirement.

          - Run: ${RUN_URL}
          - Rotation call: ${ROTATION_RESULT}

          Jobs that were not green:

          ${jobs}

          Triage: open the failing step in the called lane's log first. A call that never started
          (or a failed preflight) is a wiring failure, not a rotation failure. A missing
          called file or missing workflow_call fails the run at startup with no job, so no
          issue is filed for that case by this job (see wiring-check, and the red run itself). Re-run the workflow to confirm the fix, then close this issue."
          # Create-or-update via the shared, never-pinning helper (GitHub caps pinned
          # issues at 3, and a failed pin must never hide a red).
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
