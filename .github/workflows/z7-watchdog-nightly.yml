name: Z7 caller watchdog + protected-ref check (nightly)

# z7-rotation-weekly.yml is a thin caller whose cron fires only from main. If it is
# disabled, never starts, or dies at startup (a missing/renamed called workflow, an
# undeclared input) NOTHING inside it can alert, so this SEPARATELY scheduled
# workflow judges its run history from outside: red when there is no successful run
# within 9 days (one week plus margin), when the latest run did not succeed
# (cancelled and timed_out count), when it never started, or when the API is
# unreachable. Logic: scripts/lib/z7-watchdog.mjs (unit-tested against a stub API).
#
# The second job enforces the conditions the own-repo reusable-workflow SHA-pin
# exemption depends on (PROTECTED_REFS in scripts/verify-action-pins.mjs): each
# such branch is branch-protected and no tag shares its name. It reads the
# `protected` flag with contents: read; if the API cannot answer, the verdict is
# UNVERIFIABLE and the job fails. Whether the protection RULES are adequate is a
# founder-confirmed setting, not something this job can assert.

on:
  # 06:59 UTC, offset from the other supply-chain nightlies.
  schedule:
    - cron: '59 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  z7-watchdog:
    name: Z7 weekly caller ran recently and succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Judge the z7-rotation-weekly run history (FAIL closed)
        env:
          GH_TOKEN: ${{ github.token }}
          Z7_MAX_AGE_DAYS: '9'
        run: node scripts/verify-z7-watchdog.mjs

  protected-refs:
    name: PROTECTED_REFS are protected and not shadowed by tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `true` only when EVERY finding is "branch unprotected". Empty when the job was
    # cancelled or died before the step, which the alert treats as "not only unprotected".
    outputs:
      only_unprotected: ${{ steps.verify.outputs.only_unprotected }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify branch protection and tag absence (UNVERIFIABLE fails)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-protected-refs.mjs

  # Pin skew: the caller pins the Z7 lane YAML by SHA; this compares the YAML at that pin with
  # the integration/v2 tip (data only, nothing executed) and reds on ANY difference, an
  # unparseable pin or a failed fetch. Its own alert issue keeps the title distinct.
  z7-pin-skew:
    name: Z7 pinned workflow YAML equals the integration/v2 tip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pinned Z7 YAML with the branch tip (FAIL closed)
        env:
          GH_TOKEN: ${{ github.token }}
        # The comparison parses YAML, so it needs `yaml`. A fresh runner has no node_modules, so
        # install ONLY that one package at an exact version, lifecycle scripts off, into a scratch
        # dir beside copies of the two script files (never into the checkout), then run there.
        # The installed tarball's integrity is then checked against the repo's bun.lock (fail closed).
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/z7-pin-skew"
          mkdir -p "${work}/scripts/lib"
          cp scripts/verify-z7-pin-skew.mjs "${work}/scripts/"
          cp scripts/lib/z7-pin-skew.mjs "${work}/scripts/lib/"
          (cd "${work}" && npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund yaml@2.9.0)
          node scripts/verify-installed-yaml-integrity.mjs "${work}" "${GITHUB_WORKSPACE}/bun.lock" 2.9.0
          Z7_CALLER_FILE="${GITHUB_WORKSPACE}/.github/workflows/z7-rotation-weekly.yml" node "${work}/scripts/verify-z7-pin-skew.mjs"

  # Each check files its OWN issue (distinct fixed titles), so a permanently red
  # check cannot swallow the other's alert.
  z7-watchdog-red-alert:
    name: Z7 watchdog red alert (issue)
    needs: [z7-watchdog]
    # needs-result check fires on failure OR cancelled; always() so it still runs
    # after a failed needs job.
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.z7-watchdog.result == 'failure' || needs.z7-watchdog.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the watchdog issue (idempotent, never pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WATCHDOG_RESULT: ${{ needs.z7-watchdog.result }}
        run: |
          set -euo pipefail
          title='Z7 weekly caller watchdog RED'
          body="The nightly Z7 caller watchdog FAILED: z7-rotation-weekly.yml has no successful
          scheduled run on main in 9 days, its latest scheduled run did not succeed (cancelled and
          startup_failure count), it never started after its first due date, or the runs API was
          unreachable.

          - Run (detail in the job log): ${RUN_URL}
          - z7-watchdog result: ${WATCHDOG_RESULT}

          Check that the workflow is enabled on main and that the called lane on integration/v2
          still declares workflow_call (and that the SHA the caller pins still contains it).
          Re-run this workflow to confirm green, then close this issue."
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs

  protected-refs-red-alert:
    name: Protected-ref check red alert (issue)
    needs: [protected-refs]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.protected-refs.result == 'failure' || needs.protected-refs.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dated known exception (security/protected-refs-exception.json, max 30 days)
      # suppresses ONLY this issue, and ONLY when every finding is "branch unprotected"
      # (a tag shadow, an UNVERIFIABLE answer or any other failure still files it); the
      # check job above stays red either way. Once it expires, or if the file is missing
      # or malformed, the issue is filed.
      - name: Is a dated known exception holding?
        id: exception
        run: node scripts/protected-refs-exception-status.mjs

      - name: Create or update the protected-ref issue (idempotent, never pinned)
        if: steps.exception.outputs.active != 'true' || needs.protected-refs.outputs.only_unprotected != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFS_RESULT: ${{ needs.protected-refs.result }}
        run: |
          set -euo pipefail
          title='Protected-ref check RED'
          body="The nightly protected-ref check FAILED: a PROTECTED_REFS branch is unprotected, a
          tag shares its name, or the state was UNVERIFIABLE with the default token. The own-repo
          reusable-workflow pin exemption is unsound until this is green; the founder must confirm
          the branch protection settings.

          - Run (detail in the job log): ${RUN_URL}
          - protected-refs result: ${REFS_RESULT}

          Re-run this workflow to confirm green, then close this issue."
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs

  z7-pin-skew-red-alert:
    name: Z7 pin skew red alert (issue)
    needs: [z7-pin-skew]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.z7-pin-skew.result == 'failure' || needs.z7-pin-skew.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the pin-skew issue (idempotent, never pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKEW_RESULT: ${{ needs.z7-pin-skew.result }}
        run: |
          set -euo pipefail
          title='Z7 pin skew RED'
          body="The nightly Z7 pin-skew check FAILED: the Z7 workflow YAML on integration/v2 differs
          from the YAML at the SHA pinned in z7-rotation-weekly.yml, the pin could not be parsed, or
          the fetch failed. The diff summary (first differing line and line counts) is in the job log.

          - Run: ${RUN_URL}
          - z7-pin-skew result: ${SKEW_RESULT}

          To fix: review the integration/v2 change to z7-identity-kind-e2e.yml, then bump the SHA on
          the uses: line of z7-rotation-weekly.yml to the new integration/v2 commit (keep the
          trailing integration/v2 comment). Re-run this workflow to confirm green, then close this issue."
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
