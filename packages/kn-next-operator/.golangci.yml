version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Test code and the e2e/test support tree: long diagnostic strings, table
      # builders that are clearer appended than preallocated, one-fixture helpers
      # (unparam), and ginkgo/table-driven suites whose cyclomatic count is the
      # number of cases. Production code stays under every one of these linters.
      - linters:
          - gocyclo
          - lll
          - prealloc
          - unparam
        path: _test\.go
      - linters:
          - lll
        path: test/
      # goconst: golangci-lint v2.15 reports repeated literals in _test.go that
      # v2.8 did not (the newer goconst no longer skips tests by default). Table-
      # driven fixtures repeat literals by design, so keep the v2.8 effective
      # behaviour: production code stays under goconst, tests are exempt.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
