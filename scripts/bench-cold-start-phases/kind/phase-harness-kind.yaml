# Single-node kind variant of harness-rbac.yaml + node-agents.yaml: namespace z2, no nodeName pins.
# Generated by hand from those files; one harness pod, one clock pod, one agent pod.
# Apply after the app's namespace exists:  kubectl apply -f kind/phase-harness-kind.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase-bench
  namespace: z2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase-bench-read
  namespace: z2
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  # Experiment E1 only: the harness execs a one-shot DNS lookup in the new app
  # container (HEAL=1). Namespace-scoped to the bench namespace.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase-bench-read
  namespace: z2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase-bench-read
subjects:
  - kind: ServiceAccount
    name: phase-bench
    namespace: z2
---
apiVersion: v1
kind: Pod
metadata:
  name: phase-bench
  namespace: z2
  labels: {knext-bench: harness}
spec:
  serviceAccountName: phase-bench
  restartPolicy: Never
  containers:
    - name: harness
      image: node:24-alpine
      command: [sleep, "172800"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: clock-kind
  namespace: z2
  labels: {app: phase-clock, knext-bench: harness}
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: clock
      image: node:24-alpine
      command: [node, -e, "require('http').createServer((q,s)=>s.end(String(performance.timeOrigin+performance.now()))).listen(8080)"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-kind
  namespace: z2
  labels: {app: phase-agent, knext-bench: harness}
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: agent
      image: node:24-alpine
      command: [node, -e]
      args:
        - |
          const http = require('http'), net = require('net');
          const now = () => performance.timeOrigin + performance.now();
          http.createServer((q, s) => {
            const u = new URL(q.url, 'http://x');
            if (u.pathname === '/http') {
              // Poll GET http://ip:port<path> until the first 2xx; answer its wall time.
              const ip = u.searchParams.get('ip'), port = Number(u.searchParams.get('port'));
              const path = u.searchParams.get('path') || '/';
              const deadline = now() + Number(u.searchParams.get('ms') || 15000);
              let attempts = 0;
              const once = () => {
                if (now() > deadline) return s.end(JSON.stringify({ at: null, attempts }));
                attempts++;
                const r = http.get({ host: ip, port, path, agent: false, timeout: 1000 }, (res) => {
                  res.resume();
                  if (res.statusCode >= 200 && res.statusCode < 300) return s.end(JSON.stringify({ at: now(), attempts }));
                  setTimeout(once, 10);
                });
                r.on('timeout', () => r.destroy(new Error('timeout')));
                r.on('error', () => setTimeout(once, 10));
              };
              return once();
            }
            if (u.pathname !== '/tcp') return s.end(String(now()));
            const ip = u.searchParams.get('ip'), port = Number(u.searchParams.get('port'));
            const deadline = now() + Number(u.searchParams.get('ms') || 15000);
            let attempts = 0;
            const once = () => {
              if (now() > deadline) return s.end(JSON.stringify({ at: null, attempts }));
              attempts++;
              const c = net.connect({ host: ip, port });
              const t = setTimeout(() => c.destroy(new Error('timeout')), 200);
              c.once('connect', () => { const at = now(); clearTimeout(t); c.destroy(); s.end(JSON.stringify({ at, attempts })); });
              c.once('error', () => { clearTimeout(t); setTimeout(once, 10); });
            };
            once();
          }).listen(8080);
      resources:
        requests: {cpu: 10m, memory: 32Mi}
---
# The operator renders a default-on, port-restricted NetworkPolicy for the app. Without this additive
# allow the harness's direct probes to the new pod (:3000, :8012) and the agent's same-node polls are
# dropped, every probe-derived milestone (qp_probe_ok, app_tcp_3000, same_node_*) comes back null, and
# analyze.py falls back to the Ready condition / first byte. Benchmark-only; it widens nothing for
# anything but the labelled harness pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bench-harness-probes
  namespace: z2
spec:
  # Only the app's pods: a bare {} would also isolate the harness and agent pods themselves.
  podSelector:
    matchExpressions:
      - {key: serving.knative.dev/service, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {knext-bench: harness}
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 8012}
